name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.compiler }}, ${{ matrix.build_type }}, x86-64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        build_type: [ debug, release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'
          compiler: ${{ matrix.compiler }}
          build-type: ${{ matrix.build_type }}

      - name: Configure (${{ matrix.compiler }}-${{ matrix.build_type}})
        run: |
          cmake --preset ${{ matrix.compiler }}-${{ matrix.build_type}} -DTACHYON_ENABLE_BENCH=OFF

      - name: Build (${{ matrix.compiler }}-${{ matrix.build_type}})
        run: cmake --build --preset ${{ matrix.compiler }}-${{ matrix.build_type}}

      - name: Test
        run: ctest --test-dir build/${{ matrix.compiler }}-${{ matrix.build_type}}/test --output-on-failure --parallel 4

  cpp_aarch64:
    name: C++ (clang, release, aarch64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'

      - name: Install aarch64 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libstdc++-14-dev-arm64-cross

      - name: Configure
        run: cmake --preset clang-aarch64-release -DTACHYON_ENABLE_BENCH=OFF

      - name: Build
        run: cmake --build --preset clang-aarch64-release --target tachyon --parallel

      - name: Check ELF target
        run: |
          file build/clang-aarch64-release/core/libtachyon.so | grep -q "aarch64" || \
            (echo "Error: not an aarch64 elf." && exit 1)

  cpp_sanitizers:
    name: C++ Sanitizer (${{ matrix.sanitizer }}, Clang 21, Debug)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ asan, msan, tsan ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'
          build-type: 'debug'
          sanitizer: ${{ matrix.sanitizer }}

      - name: Build instrumented libc++
        if: matrix.sanitizer == 'msan'
        run: bash ci/build_msan_libcxx.sh 21

      - name: Configure
        run: cmake --preset ${{ matrix.sanitizer }} -DTACHYON_ENABLE_BENCH=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.sanitizer }} --parallel

      - name: Test
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:print_stacktrace=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:print_summary=1"
          MSAN_OPTIONS: "abort_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1 history_size=5"
        run: ctest --test-dir build/${{ matrix.sanitizer }}/test --output-on-failure --parallel 1

  cpp_macos:
    name: C++ macOS (${{ matrix.runner }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-26, macos-26-intel ]
        build_type: [ debug, release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'
          build-type: ${{ matrix.build_type }}

      - name: Configure
        run: cmake --preset macos-${{ matrix.build_type }} -DTACHYON_ENABLE_BENCH=OFF

      - name: Build
        run: cmake --build --preset macos-${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build/macos-${{ matrix.build_type }}/test --output-on-failure --parallel 4

  cpp_format_check:
    name: C++ Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'

      - name: Format Check
        run: find core/ benchmark/ test/ fuzz/ tools/ -name '*.cpp' -o -name '*.hpp' | xargs clang-format-21 --dry-run --Werror

  tachyon_top:
    name: Tachyon Top
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'

      - name: Configure
        run: cmake --preset tachyon-top-ci

      - name: Build
        run: cmake --build --preset tachyon-top-ci --parallel

      - name: Smoke test
        run: |
          OUTPUT=$(./build/tachyon-top-ci/tools/tachyon-top/tachyon_top --json)
          echo "Raw output: $OUTPUT"
          PARSED=$(echo "$OUTPUT" | jq -c '.')
          if [ "$PARSED" != "[]" ]; then
            echo "::error::Smoke test failed! Expected '[]', but got '$PARSED'"
            exit 1
          fi
          echo "Smoke test passed successfully."

  python:
    name: Python bindings (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'python'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download DLPack (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /usr/local/include/dlpack
          sudo curl -fsSL -o /usr/local/include/dlpack/dlpack.h \
            https://raw.githubusercontent.com/dmlc/dlpack/main/include/dlpack/dlpack.h

      - name: Download DLPack (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /usr/local/lib/dlpack
          sudo curl -fsSL -o /usr/local/lib/dlpack/dlpack.h \
            https://raw.githubusercontent.com/dmlc/dlpack/main/include/dlpack/dlpack.h


      - name: Install and test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ./bindings/python pytest
          .venv/bin/pytest bindings/python/tests/ -v

  rust:
    name: Rust bindings (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'rust'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format Check
        working-directory: bindings/rust
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: bindings/rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: bindings/rust
        run: cargo test

  go:
    name: Go bindings (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'go'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: 'bindings/go'

      - name: Go Test
        env:
          CGO_ENABLED: "1"
        working-directory: bindings/go
        run: go test -v -count=1 -timeout=120s ./tachyon/...

      - name: Go Vet
        env:
          CGO_ENABLED: "1"
        working-directory: bindings/go
        run: go vet ./tachyon/...

  jvm:
    name: JVM bindings (${{ matrix.lang }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
        lang: [ java, kotlin ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'java'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: |
            bindings/${{ matrix.lang }}/*.gradle*
            bindings/${{ matrix.lang }}/**/gradle-wrapper.properties

      - name: Build Native library (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --preset clang-ci
          cmake --build --preset clang-ci --target tachyon_java_resources

      - name: Build Native library (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos-ci
          cmake --build --preset macos-ci --target tachyon_java_resources --parallel

      - name: Gradle Test
        working-directory: bindings/${{ matrix.lang }}
        run: ./gradlew test --no-daemon

  nodejs:
    name: Node.js bindings ${{ matrix.runner }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
        node-version: [ 20, 22, 24 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'node'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bindings/js/package-lock.json

      - name: Install dependencies & build native library
        working-directory: bindings/js
        run: npm install && npm run build:native

      - name: Type check
        working-directory: bindings/js
        run: npx tsc --noEmit

      - name: Format check
        working-directory: bindings/js
        run: npm run format:check

      - name: Lint check
        working-directory: bindings/js
        run: npm run lint

      - name: Build TypeScript
        working-directory: bindings/js
        run: npm run build:ts

      - name: Tests
        working-directory: bindings/js
        run: npm test

  cpp_wasm:
    name: C++ (Emscripten, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ debug, release ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'cpp'

      - name: Setup Emscripten
        uses: ./.github/actions/setup-emsdk

      - name: Configure
        run: cmake --preset emscripten-${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset emscripten-${{ matrix.build_type }}

      - name: Check WASM artefacts
        run: |
          ls -lh build/emscripten-${{ matrix.build_type }}/core/libtachyon.a
          ls -lh build/emscripten-${{ matrix.build_type }}/core/tachyon.js
          ls -lh build/emscripten-${{ matrix.build_type }}/core/tachyon.wasm

  nodejs_browser_wasm:
    name: Browser WASM tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: bindings/js/package-lock.json

      - name: Install dependencies
        working-directory: bindings/js
        run: npm install --ignore-scripts

      - name: Check Chromium
        run: /usr/bin/chromium --version

      - name: Setup Emscripten
        uses: ./.github/actions/setup-emsdk

      - name: Rebuild and verify shipped WASM artifacts
        working-directory: bindings/js
        run: |
          npm run build:wasm
          git diff --exit-code -- src/ts/wasm/tachyon.js src/ts/wasm/tachyon.wasm

      - name: Browser WASM tests
        working-directory: bindings/js
        env:
          CHROMIUM_BIN: /usr/bin/chromium
        run: npm run test:browser

      - name: Packed browser package and type declarations
        working-directory: bindings/js
        env:
          CHROMIUM_BIN: /usr/bin/chromium
        run: npm run test:package

      - name: Build C++ browser demo
        working-directory: examples/browser_wasm
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Browser demo integration
        working-directory: bindings/js
        env:
          CHROMIUM_BIN: /usr/bin/chromium
          TACHYON_BROWSER_DEMO: '1'
        run: npm run test:browser

  csharp:
    name: C# Bindings (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, macos-26, macos-26-intel ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-tachyon-env
        with:
          lang: 'c#'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Build native library
        if: runner.os == 'Linux'
        run: |
          cmake --preset clang-ci
          cmake --build --preset clang-ci --parallel
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native
          cp build/clang-ci/core/libtachyon.so bindings/csharp/src/TachyonIpc/runtimes/linux-x64/native/

      - name: Build Native library
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos-ci
          cmake --build --preset macos-ci --parallel
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then 
            RID="osx-arm64"; 
          else 
            RID="osx-x64";
          fi
          mkdir -p bindings/csharp/src/TachyonIpc/runtimes/${RID}/native
          cp build/macos-ci/core/libtachyon.dylib bindings/csharp/src/TachyonIpc/runtimes/${RID}/native/

      - name: Build
        working-directory: bindings/csharp
        run: dotnet build src/TachyonIpc/

      - name: Test
        working-directory: bindings/csharp
        run: dotnet test tests/TachyonIpc/
