name: Setup Native Core
description: Installs LLVM, CMake, and vendor the C++ core
inputs:
  lang:
    description: Target language for vendoring
    required: true
  llvm-version:
    description: LLVM version to use
    required: false
    default: '21'
runs:
  using: composite
  steps:
    - name: Setup Kitware
      if: runner.os == 'Linux'
      uses: ./.github/actions/kitware-apt

    - name: Install LLVM ${{ inputs.llvm-version }}
      if: runner.os == 'Linux'
      shell: bash
      run: bash ci/install_llvm.sh ${{ inputs.llvm-version }}

    - name: Vendor C++ core
      shell: bash
      run: bash ci/vendor.sh ${{ inputs.lang }}
